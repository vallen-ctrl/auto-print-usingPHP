info:
  name: Add paper
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/paper"
  body:
    type: json
    data: |-
      {
        "name": "A421",
        "width": 114,
        "height": 231,
        "harga_color": 1000,
        "harga_grayscale": 500
      }
  auth:
    type: bearer
    token: "{{barer_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
