info:
  name: Layanan
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/layanan"
  body:
    type: json
    data: |-
      {
        "nama": "laminating",
        "deskripsi": "halo halo hi",
        "harga": 5000
      }
  auth:
    type: bearer
    token: "{{barer_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
