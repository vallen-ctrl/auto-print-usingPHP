[package]
name = "tauri-qr"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# minimal: hanya webview (wry), tanpa fitur tambahan
tauri = { version = "2", default-features = false, features = ["wry"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# binary sekecil & seringan mungkin
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
